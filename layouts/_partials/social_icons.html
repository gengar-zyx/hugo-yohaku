<div class="social-icons" {{ with .align }}align="{{ . }}"{{ end }}>
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}" aria-label="{{ .title | default .name }}">
        {{- if eq (lower .name) "bangumi" }}
        {{ partial "bangumi_icon.html" . }}
        {{- else }}
        {{ partial "svg.html" . }}
        {{- end }}
    </a>
    {{- end }}
</div>

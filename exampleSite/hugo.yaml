baseURL: https://example.org/
title: Yohaku 示例
locale: zh-cn
defaultContentLanguage: zh
hasCJKLanguage: true
# 预览命令通过 --theme 指定仓库目录名，避免依赖克隆目录的名称。
pagination:
  pagerSize: 5
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
params:
  author: 示例作者
  description: 为中文长文和技术笔记留一处安静的阅读空间。
  mainSections: [posts]
  DateFormat: "2006-01-02"
  defaultTheme: auto
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  showtoc: true
  tocopen: false
  homeInfoParams:
    Title: Yohaku · 余白
    Content: 为文字留一些空间，记录阅读、写作与技术笔记。
  socialIcons:
    - name: rss
      title: RSS
      url: /index.xml
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.4
    keys: [title, permalink, summary, content]
menu:
  main:
    - name: 归档
      url: /archives/
      weight: 10
    - name: 搜索
      url: /search/
      weight: 20
    - name: 分类
      url: /categories/
      weight: 30
    - name: 标签
      url: /tags/
      weight: 40
outputs:
  home: [HTML, RSS, JSON]
markup:
  highlight:
    noClasses: false
